# =============================================================================
# Alertmanager Configuration
# AWS EC2 Infrastructure Monitoring Stack
# =============================================================================
#
# This is a base configuration that receives alerts from Prometheus and
# routes them to a default receiver.
#
# To add real notifications, configure one of the receiver options below.
# Never commit real credentials, passwords, tokens, or API keys to this file.
#
# =============================================================================

global:
  # Time to wait before declaring an alert resolved after it stops firing
  resolve_timeout: 5m

# Route tree — determines which receiver handles which alerts
route:
  # Default receiver for all alerts
  receiver: default

  # Optional: group alerts by alertname to reduce noise
  group_by:
    - alertname
    - instance

  # Wait this long before sending the first alert notification in a group
  group_wait: 30s

  # Wait this long before sending a notification for new alerts added to a group
  group_interval: 5m

  # How long to wait before resending an alert that has already been sent
  repeat_interval: 4h

# Receivers define where to send alert notifications
receivers:
  - name: default
    # ------------------------------------------------------------------
    # No notification channel is configured in this base configuration.
    # The receiver accepts alerts but does not forward them anywhere.
    #
    # To add email notifications, add an email_configs block below.
    # To add Slack notifications, add a slack_configs block below.
    # To add a webhook, add a webhook_configs block below.
    #
    # Example email_configs (do NOT commit real credentials):
    #
    # email_configs:
    #   - to: 'your-email@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'your-username'
    #     auth_password: 'YOUR_SMTP_PASSWORD'   # Use environment variable instead
    #
    # Example slack_configs (do NOT commit real tokens):
    #
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'     # Use environment variable instead
    #     channel: '#alerts'
    # ------------------------------------------------------------------
