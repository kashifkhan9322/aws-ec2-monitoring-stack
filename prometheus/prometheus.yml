# =============================================================================
# Prometheus Configuration
# AWS EC2 Infrastructure Monitoring Stack
# =============================================================================
#
# IMPORTANT: Replace MONITORED_SERVER_PRIVATE_IP with the actual private IP
# address of your EC2 instance running Node Exporter before deploying.
#
# Example: 10.0.1.45:9100
#
# =============================================================================

global:
  # How frequently Prometheus scrapes targets
  scrape_interval: 15s

  # How frequently Prometheus evaluates alerting rules
  evaluation_interval: 15s

# Load alert rule files
rule_files:
  - /etc/prometheus/rules/node-alerts.yml

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Scrape configurations
scrape_configs:

  # Prometheus scrapes its own metrics
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Scrape Node Exporter on the monitored EC2 instance
  # Replace MONITORED_SERVER_PRIVATE_IP with the actual private IP address
  - job_name: node-exporter
    static_configs:
      - targets:
          - MONITORED_SERVER_PRIVATE_IP:9100
        labels:
          server: monitored-ec2
